name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No `version` input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The committed spec must match the code. Export needs config but no database.
      - run: cp .env.example .env
      - run: pnpm export:spec
      - run: git diff --exit-code specs/

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait --wait-timeout 180
      - run: docker compose --env-file .env -f infra/docker-compose.yml ps
      # Smoke check: the seed must run cleanly (schema validation and unique indexes) against real MongoDB.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed
      # Access check: start the API, then call every operation as every role and compare with the spec.
      - run: pnpm start:host > host.log 2>&1 &
      - run: curl --silent --fail --retry 60 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/health
      - run: pnpm check:access
      - run: pnpm test:e2e
      # Platform API: tenant isolation, spec lifecycle, limits and SSRF, on its own e2e database.
      - run: pnpm test:e2e:platform
      # Checkpointer (Step 4.3): LangGraph's official conformance suite on MongoSaver, plus the
      # required approval test (no write before approval, no second run after a restart).
      - run: pnpm test:e2e:checkpoint
      - if: failure()
        run: cat host.log
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
